  // diagnostics: any uncaught error or failed module import is recorded here so the
  // panel can be verified headlessly (and so a broken CDN is visible, not silent).
  window.__errors = [];
  addEventListener('error', e => {
    window.__errors.push(String(e.message || e.error || 'error') +
      (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  }, true);
  addEventListener('unhandledrejection', e => {

<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1f2b38;

    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans)}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* ---------- top bar ---------- */
  #bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;
       padding:0 14px;background:linear-gradient(180deg,rgba(11,15,20,.96),rgba(11,15,20,.72));
       border-bottom:1px solid var(--line);backdrop-filter:blur(8px);z-index:20;overflow-x:auto}
  #bar .brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);
       white-space:nowrap;font-weight:600}
  #bar .brand small{display:block;color:var(--dim);letter-spacing:.06em;font-size:10px;text-transform:none}
  #bar .sp{flex:1}
  button.b{background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;
       font-size:12px;padding:7px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:.14s}
  button.b:hover{border-color:var(--cy);color:var(--cy)}
  button.b.on{background:#16302f;border-color:var(--cy);color:var(--cy)}
  .seg{display:flex;gap:0}
  .seg button.b{border-radius:0}
  .seg button.b:first-child{border-radius:6px 0 0 6px}
  .seg button.b:last-child{border-radius:0 6px 6px 0;border-left:0}

  /* ---------- side panel ---------- */
  #panel{position:fixed;top:52px;right:0;bottom:0;width:400px;max-width:92vw;background:var(--panel);
      border-left:1px solid var(--line);z-index:15;display:flex;flex-direction:column;
      transform:translateX(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden}
  #panel.open{transform:none}
  #ph{padding:16px 18px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}
  #ph .kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  #ph h2{margin:5px 0 0;font-size:19px;line-height:1.25}
  #ph .status{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:10px;
      padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  #ph .status.settled{color:var(--gr);border-color:#25452b}
  #ph .status.open{color:var(--am);border-color:#4a3a1c}
  #ph .status.contested{color:var(--rd);border-color:#4d2a24}
  #close{position:absolute;top:60px;right:14px;background:none;border:0;color:var(--dim);
      font-size:22px;cursor:pointer;line-height:1;z-index:16}
  #close:hover{color:var(--txt)}
  #pbody{flex:1;overflow-y:auto;padding:16px 18px 28px;font-size:13px;line-height:1.6}
  #pbody::-webkit-scrollbar{width:9px}
  #pbody::-webkit-scrollbar-thumb{background:#243243;border-radius:9px}
  #pbody h3{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--cy);
      margin:20px 0 8px;font-weight:600}
  #pbody h3:first-child{margin-top:0}
  #pbody p{margin:0 0 10px;color:#bccbd9}
  #pbody ul{margin:0 0 10px;padding-left:17px;color:#bccbd9}

  .spec{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
  .spec td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .spec td:first-child{color:var(--dim);width:44%;padding-right:10px}
  .spec td:last-child{color:var(--txt)}
  .note{border-left:2px solid var(--am);background:#1a1509;padding:9px 11px;border-radius:0 5px 5px 0;
      margin:0 0 11px;font-size:12px;color:#e8d5a8}
  .note.danger{border-color:var(--rd);background:#1c110e;color:#f0c4bb}
  .note.ok{border-color:var(--gr);background:#0f1a12;color:#c3e3c7}
  .wiki{font-family:var(--mono);font-size:10.5px;color:var(--dim);word-break:break-all}
  .live{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;
      padding:6px 0;border-bottom:1px solid var(--line)}

      font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:5px;text-decoration:none}

      overflow-y:auto;padding:26px}
  #ledger.open{display:block}
  #ledger .wrap{max-width:940px;margin:0 auto}
  #ledger h1{font-size:20px;margin:0 0 4px}
  #ledger .sub{color:var(--dim);font-size:12px;margin-bottom:22px}
  #ledger h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);margin:26px 0 9px}
  table.lg{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  table.lg th{text-align:left;color:var(--dim);font-weight:400;padding:7px 9px;border-bottom:1px solid var(--line);
      font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  table.lg td{padding:7px 9px;border-bottom:1px solid var(--line)}
  table.lg tr:hover td{background:#101822}
  .neg{color:var(--rd)} .pos{color:var(--gr)} .num{text-align:right}
  .warn{border-left:2px solid var(--rd);background:#1c110e;padding:13px 15px;border-radius:0 6px 6px 0;
      margin:16px 0;font-size:13px;color:#f0c4bb}

  /* ---------- hud ---------- */
  #hint{position:fixed;bottom:14px;left:14px;font-family:var(--mono);font-size:11px;color:var(--dim);
      background:rgba(11,15,20,.8);border:1px solid var(--line);padding:7px 11px;border-radius:6px;z-index:14}
  #tip{position:fixed;pointer-events:none;background:rgba(8,11,15,.94);border:1px solid var(--cy);
      color:var(--txt);font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:5px;
      z-index:30;display:none;white-space:nowrap}
  #clock{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;min-width:150px;text-align:right}
  #clock b{color:var(--am);font-weight:400}
  @media(max-width:720px){
    #bar{height:auto;flex-wrap:wrap;padding:9px 10px;gap:6px}
    #panel{top:0;width:100%;max-width:100%;padding-top:0}
    #close{top:12px}
    #ledger{inset:0;padding:16px}
    #hint{display:none}
  }
</style>

      envelope:"Any panel whose footprint fits the assigned roof area and whose cold-Voc + Imp sit inside the controller window. Panel count is an OUTPUT of the design, not an input.",
      notes:[ "The roof is clear because the A/C is in the basement — that is the enabling gift of this coach.",
              "The transcript's '8 is the sweet spot' optimises for serviceability and the controller ceiling, not for the energy balance.",
              "⚠️ Alfa See Ya fibreglass had a documented delamination problem. VHB transfers load into that skin — tap-test before bonding anything." ],
      wiki:"entities/solar-array.md + entities/adhesive-mounting.md" },

    { id:"shutters", label:"Bermuda solar shutters", group:"Generation", status:"open",
      spec:{ "Concept":"Free-standing, wheeled, tiltable PV that docks to the sun-facing side",
             "Functions":"Shade + generation + awning — three from one object",
             "Attachment":"Un-affixed: no fasteners, no fibreglass loading","Blocker":"Wind uplift (the kite problem)" },
      envelope:"3–4 deployable panels add ≈4–6 kWh/day at average sun AND cut solar gain before it enters the glass. Tilt is seasonal, not daily.",
      notes:[ "This is the most inventive idea in the plan: it resolves area vs controller-ceiling vs shading in one object.",
              "It is load-bearing, not a nice-to-have — without it the roof area alone cannot serve the load.",
              "⚠️ 20 sq ft of flat panel on wheeled legs in a 35 mph gust is a land-yacht. Requires outriggers or water-ballast base. Not yet designed." ],
      wiki:"entities/bermuda-solar-shutter.md" },

    { id:"mast", label:"VAWT wind rig", group:"Generation", status:"open",
      spec:{ "Turbine":"One vertical-axis turbine (not propeller)","Mast":"20–25 ft telescoping, in the Class IV hitch receiver",
             "Isolation":"Thick rubber sleeve — decouples low-frequency hum from the chassis",
             "Stability":"3-point guy wires to heavy earth anchors","Cut-in":"≈1.3 m/s (claimed)" },
      envelope:"0.5–1.0 kWh/night realistic. Capacity factor for small wind at a decent site is 10–20%, and power scales with the CUBE of wind speed.",
      notes:[ "Not on the roof: blade harmonics travel through a hollow fibreglass box, and a 13 ft rig presents a sail that would tear the mount out.",
              "The hitch receiver is rated ~10,000 lb and is welded to the frame — all mechanical stress bypasses the fibreglass.",
              "⚠️ A turbine CANNOT feed an all-in-one's solar port: no dump load means free-spin bearing destruction when the battery is full. Needs its own controller + resistive dump load.",
              "The honest test before buying: NASA POWER wind data for the actual parking coordinates. If the site sits below cut-in most of the time, this is a sculpture." ],
      wiki:"entities/vawt-windmaxxr-rig.md + concepts/wind-capacity-factor.md" },

    { id:"genset", label:"10 kW diesel generator", group:"Backstop", status:"settled",
      spec:{ "Output":"10 kW class, on the coach's own fuel tank","Role":"Automatic backstop at low SoC","Trigger":"Dry contact from the inverter/charger (~15% SoC)",
             "Fuel":"≈0.5–1.0 gal/h" },
      envelope:"Runs at its efficient point to recharge the bank to ~80%, then shuts down. Silence is the default state; noise is the exception.",
      notes:[ "This is the third leg of the system — for this load profile the backstop is a diesel engine, not more renewables.",
              "⚠️ It shares the vehicle's fuel tank. A long generator run can strand the coach — set a low-fuel interlock that reserves real driving range.",
              "⚠️ CO and exhaust: any repositioning or extended run needs an explicit CO review. Detection in the living space is required, not optional.",
              "A 10 kW diesel auto-starting at 03:00 is a social problem before it is a technical one. Consider quiet-hours constraints in the logic." ],
      wiki:"entities/diesel-generator-10kw.md" },

    { id:"bank", label:"48 V LiFePO4 bank", group:"Storage", status:"open",
      spec:{ "Configuration":"4 × 48 V 300 Ah server-rack (native 48 V, never 12 V in series)",
             "Capacity":"≈61.4 kWh (≈15.4 kWh per unit)","Weight":"≈1,100 lb total, ≈280 lb per unit",
             "Placement":"Over the rear axles, in the basement bay","C-rate":"≈26 A at 1.25 kW — trivially inside spec. NOT the binding constraint." },
      envelope:"15.4 kWh (entry, 4×12V-300Ah) to 61.4 kWh (Leviathan class). 61.4 kWh = 2.0 days at a 1.25 kW steady load, 1.6 days at 1.6 kW.",
      notes:[ "Server-rack units with closed-loop BMS, NOT a DIY prismatic pack: potholes at highway speed plus loose busbars equals arc flash.",
              "⚠️ LiFePO4 cannot be charged below 0 °C — the BMS blocks it to prevent permanent lithium plating. In an unheated bay, winter PV makes power you cannot store. Self-heating batteries should be a hard selection criterion.",
              "⚠️ ~1,100 lb in one bay is a FLOOR-loading problem, not a chassis problem. Needs a welded steel cage tied to the frame plus a real axle-weight check.",
              "Silver lining: the heaviest new mass sits low in the basement, which is favourable for centre of gravity." ],
      wiki:"entities/target-48v-bank.md" },

    { id:"inverter", label:"Inverter / charger brain", group:"Routing", status:"open",
      spec:{ "Candidates":"Victron Quattro 48/10000 class vs EG4 18kPV class",
             "Must do":"Invert · charge · transfer between two AC inputs · auto-start the genset · expose telemetry",
             "Transfer":"<20 ms — IT equipment must not reboot","PowerAssist":"Supplements a weak pedestal from the battery instead of tripping breakers" },
      envelope:"THE architecture fork: a capped all-in-one keeps the solar-input ceiling; a bare inverter/charger plus separate industrial MPPTs removes it entirely. This choice determines every downstream number.",
      notes:[ "Telemetry is not optional — load-shedding scripts that gate GPU work on battery state are what make a 1.25 kW node viable on this generation budget.",
              "Prefer local Modbus TCP / MQTT from a GX-class device over any cloud API: if the internet is down, the load-shedding logic must still work.",
              "Two independent AC inputs (shore + generator) with automatic arbitration is exactly the architecture this rig needs." ],
      wiki:"entities/inverter-charger-brain.md + comparisons/victron-vs-eg4.md" },

    { id:"compute", label:"GPU compute node", group:"Load", status:"open",
      spec:{ "Target":"4 × RTX 5070 class","Draw":"≈1,250 W with host (≈1,000 W GPUs)",
             "Rejected":"4 × RTX 5090 — 2,600 W would empty the bank in under 3 h",
             "Host":"Proxmox VE; idle-draw is the decisive platform criterion",
             "Ventilation":"≈200–260 CFM minimum, N+1 fan redundancy" },
      envelope:"Platform choice dominates energy: EPYC/Threadripper idle at 100–150 W doing nothing. 2× RTX 4090 on a high-end consumer CPU gives comparable heavy compute at ≈30 W idle — worth ≈2.4 kWh/day.",
      notes:[ "Load shedding is mandatory, not a nicety: spin GPUs up when generation is strong, throttle when SoC falls, and never touch the 12 V island.",
              "Deliberately a bolted-on experiment, killable at any time without affecting life support.",
              "It lives between the drive tyres for acoustic silence — which trades a noise problem for an airflow and humidity problem.",
              "Whether this is income or a self-powered hobby is unproven. Naming which one it is changes which decisions are correct." ],
      wiki:"entities/compute-node.md + concepts/compute-arbitrage.md" },

    { id:"network", label:"Network + PoE backbone", group:"Load", status:"open",
      spec:{ "WAN":"Starlink + 5G bonded and failing over, via an open-source router (OPNsense class)",
             "LAN":"One managed 8-port gigabit PoE switch feeding PoE HATs, cameras, Pi cluster",
             "Overlay":"Tailscale/WireGuard — MANDATORY, not optional","Draw":"≈150 W continuous" },
      envelope:"Do not put ten wall-warts on the inverter: each AC brick wastes 10–15%. One DC-fed PoE switch powers and connects everything downstream over single Cat6 runs.",
      notes:[ "CGNAT is a fact of both Starlink and cellular: there is no public IPv4 and no port forwarding. An overlay tunnel is the only path in.",
              "The overlay is also what lets the dashboard reach the rig's Grafana/Proxmox endpoints from anywhere — whatever the rig's IP is.",
              "Segmentation matters: a compromised service must not reach the inverter telemetry control plane." ],
      wiki:"entities/network-and-overlay.md" },

    { id:"island", label:"12 V house island", group:"Life support", status:"settled",
      spec:{ "Load":"≈25–35 Ah/day (≈0.32–0.44 kWh) — lights, water pump, vent fan",
             "Fed by":"Its own panel(s) + its own MPPT. NOT distributed from the 48 V bank.",
             "Autonomy":"≈8.6 days on ~3 kWh usable with zero generation" },
      envelope:"2–3 panels gives genuine winter margin and panel-failure redundancy — cheap, because the load is tiny. The split vs the compute side is CONTESTED.",
      notes:[ "This is the project's best decision: if a runaway Proxmox job drains the 48 V bank, you must not lose lights and water. Coupling life support to the GPU experiment inverts the priority order.",
              "Keep the streams separate: a Victron-class MPPT for solar, a separate wind controller with its own dump load. If the chaotic wind controller dies, solar keeps the island alive.",
              "⚠️ Open question: the 25–35 Ah/day estimate omits the RV FURNACE. A 12 V furnace blower draws 5–8 A while running. If the furnace is on this island, winter load is dominated by it and the sizing changes completely." ],
      wiki:"entities/rv-12v-house-island.md + concepts/panel-split-strategy.md" },

    { id:"shore", label:"50 A shore pedestal input", group:"Backstop", status:"settled",
      spec:{ "Input":"50 A / 30 A RV shore cord, as AC input 1",

             "Legacy charger":"Xantrex unit in the basement — MODEL UNVERIFIED" },
      envelope:"A 30 A pedestal is 120 V only, which is exactly why the mini-split must be 120 V. PowerAssist exists so a weak pedestal supplements from the battery instead of tripping.",
      notes:[ "The self-shore trick preserves 20-year-old factory wiring and its protection, and is reversible by unplugging one cord.",

    { id:"minisplit", label:"120 V mini-split", group:"Load", status:"settled",
      spec:{ "Voltage":"120 V (decided)","Capacity":"≈12,000 BTU after solar-gain reduction",

      wiki:"entities/minisplit-cooling.md + comparisons/120v-vs-240v-minisplit.md" }

function flow(pts, color, speed, label){
  const mat = new THREE.MeshBasicMaterial({ color });
  // draw the route as a faint line so the travelling beads read as "on a wire",
  // not as dots floating in mid-air.
  const lineGeo = new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(...p)));
  const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
    color, transparent:true, opacity:0.28 }));
  flowGrp.add(line);
  const n = 4;
  const beads = [];
  for (let i=0;i<n;i++){
    const b = new THREE.Mesh(pulseGeo, mat);
    flowGrp.add(b); beads.push({ mesh:b, t:i/n });
  }
  const seg = [];
  let total = 0;
  for (let i=0;i<pts.length-1;i++){
    const a = new THREE.Vector3(...pts[i]), b2 = new THREE.Vector3(...pts[i+1]);
    const len = a.distanceTo(b2); seg.push({ a, b:b2, len, start:total }); total += len;
  }
  flows.push({ beads, seg, total, speed, label });
}

const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const tip = document.getElementById('tip');
let hovered = null;
let currentId = null;   // the component whose panel is open (used by scan-mode beacons)

function hitAt(ev){
  ptr.x = (ev.clientX / innerWidth) * 2 - 1;
  ptr.y = -(ev.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ptr, camera);
  // beacons are raycast alongside the model so hotspots stay hittable in scan mode
  const objs = (beaconGrp && beaconGrp.visible) ? pickable.concat(beaconGrp.children) : pickable;
  const hits = ray.intersectObjects(objs, true);
  for (const h of hits){
    let o = h.object;
    while (o && !o.userData.component) o = o.parent;
    if (o && o.userData.component) return o.userData.component;
  }
  return null;
}
function setHighlight(id, on){
  if (!id) return;
  for (const root of pickable){
    if (root.userData.component !== id) continue;
    root.traverse(o => {
      if (!o.isMesh || !o.material || !o.material.emissive) return;
      if (on){
        // materials are shared between meshes of the same type, so clone before
        // tinting — otherwise highlighting one component lights up unrelated parts.
        if (!o.userData._origMat){ o.userData._origMat = o.material; o.material = o.material.clone(); }
        o.material.emissive.setHex(0x2fd0c9);
        o.material.emissiveIntensity = 0.55;
      } else if (o.userData._origMat){
        o.material.dispose();
        o.material = o.userData._origMat;
        delete o.userData._origMat;
      }
    });
  }
}
renderer.domElement.addEventListener('pointermove', ev => {
  const id = hitAt(ev);
  if (id !== hovered){
    if (hovered) setHighlight(hovered, false);
    hovered = id;
    if (id) setHighlight(id, true);
    renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  }
  if (id){
    const c = WIKI.components.find(x => x.id === id);
    tip.textContent = c ? c.label : id;
    tip.style.display = 'block';
    tip.style.left = (ev.clientX + 14) + 'px';
    tip.style.top  = (ev.clientY + 14) + 'px';
  } else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerdown', ev => { downAt = { x:ev.clientX, y:ev.clientY }; });
let downAt = null;
renderer.domElement.addEventListener('pointerup', ev => {
  tip.style.display = 'none';
  if (!downAt) return;
  const moved = Math.hypot(ev.clientX-downAt.x, ev.clientY-downAt.y);
  downAt = null;
  if (moved > 5) return;             // it was an orbit drag, not a click
  const id = hitAt(ev);
  if (id) select(id);
});
renderer.domElement.addEventListener('pointerleave', () => {
  tip.style.display = 'none';
  if (hovered) setHighlight(hovered, false);
  hovered = null;
});

/* ============================================================================
   LOOP
   ========================================================================== */
const clock = new THREE.Clock();
// per-frame hooks registered by optional modules (photoreal etc.) so the core loop
// never needs to know about them
const FRAME_HOOKS = [];

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // turbine spin (only meaningful when deployed)
  if (mastGrp.visible) turbine.rotation.y += dt * 1.15;

  // gentle idle sway so the coach does not look dead
  coach.rotation.z = Math.sin(t*0.5) * 0.0016;
  coach.position.y = Math.sin(t*0.7) * 0.035;

  // shutter deploy/stow animation
  for (const s of shutters){
    if (s.target !== undefined && Math.abs(s.g.position.z - s.target) > 0.01){
      s.g.position.z += (s.target - s.g.position.z) * Math.min(1, dt*3.2);
    }
  }

  // energy pulses
  if (flowOn){
    for (const f of flows){
      for (const b of f.beads){
        b.t += dt * f.speed;
        if (b.t > 1) b.t -= 1;
        const d = b.t * f.total;
        let seg = f.seg[0];
        for (const s of f.seg){ if (d >= s.start) seg = s; }
        const k = (d - seg.start) / seg.len;
        b.mesh.position.lerpVectors(seg.a, seg.b, Math.max(0, Math.min(1, k)));
      }
    }
  }

  // camera flight
  if (flight){
    flight.k = Math.min(1, flight.k + dt * 1.35);
    const e = 1 - Math.pow(1 - flight.k, 3);
    camera.position.lerpVectors(flight.p0, flight.p1, e);
    controls.target.lerpVectors(flight.t0, flight.t1, e);
    if (flight.k >= 1) flight = null;
  }

  for (const h of FRAME_HOOKS) h(dt, t);

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {

/* ============================================================================
   PHOTOREAL SCAN MODE  (additive — the working panel must survive its failure)

   A Gaussian splat is surface, not structure: it looks real but knows nothing
   about what a component *is*. So the scan supplies the visuals and the existing
   procedural model stays in the scene at zero opacity as the click layer, with
   beacons marking each hotspot's position. Spark and three stay isolated from the
   core path: the import is dynamic, the whole thing is try/caught, and a failure
   leaves the normal model exactly as it was.
   ========================================================================== */
let photoreal = false;
let sparkRenderer = null, splatMesh = null, beaconGrp = null;
let photorealBusy = false;
let splatReady = false, splatLoadMs = null;
const compBounds = {};
let modelMatState = null;   // saved material state so hide/restore is lossless

function componentBounds(){
  coach.updateMatrixWorld(true);
  for (const root of pickable){
    const id = root.userData.component;
    if (!id) continue;
    const b = new THREE.Box3().setFromObject(root);
    if (b.isEmpty()) continue;
    if (compBounds[id]) compBounds[id].union(b); else compBounds[id] = b.clone();
  }
}

function buildBeacons(){
  if (beaconGrp) return beaconGrp;
  componentBounds();
  beaconGrp = new THREE.Group();
  beaconGrp.visible = false;
  scene.add(beaconGrp);
  for (const id in compBounds){
    const c = compBounds[id].getCenter(new THREE.Vector3());
    const sz = compBounds[id].getSize(new THREE.Vector3()).length();
    const r = Math.max(0.8, Math.min(3.0, sz * 0.16));
    const mat = new THREE.MeshBasicMaterial({ color:0x3fd0c9, transparent:true, opacity:0.9,
      depthTest:false, blending:THREE.AdditiveBlending });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.07, 8, 32), mat);
    ring.position.copy(c); ring.rotation.x = -Math.PI/2;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, r*0.55, 6), mat);
    stem.position.copy(c);
    for (const m of [ring, stem]){ m.userData.component = id; m.userData.beacon = true; m.renderOrder = 999; }
    beaconGrp.add(ring, stem);
  }
  FRAME_HOOKS.push((dt, t) => {
    if (!beaconGrp.visible) return;
    const pulse = 1 + Math.sin(t * 2.2) * 0.06;
    for (const o of beaconGrp.children){
      const active = o.userData.component === (hovered || currentId);
      o.scale.setScalar(pulse * (active ? 1.35 : 1));
      o.material.opacity = active ? 1.0 : 0.72;
    }
  });
  return beaconGrp;
}

function hideModel(){
  if (modelMatState) return;
  // Materials are SHARED between meshes (one M.shell across dozens of parts), so the
  // save/restore must be keyed on unique materials. Saving per-mesh captures opacity 0
  // for every mesh after the first and the restore then leaves the model invisible.
  const mats = new Set();
  const meshes = [];
  coach.traverse(o => {
    if (!o.isMesh || !o.material) return;
    mats.add(o.material);
    meshes.push({ mesh:o, castShadow:o.castShadow });
  });
  modelMatState = { mats:[], meshes };
  for (const m of mats){
    modelMatState.mats.push({ mat:m, transparent:m.transparent, opacity:m.opacity,
                              depthWrite:m.depthWrite });
    // opacity 0 keeps the mesh raycastable — visible=false would remove it from picking
    const changed = (m.transparent !== true);
    m.transparent = true;
    m.opacity = 0;
    m.depthWrite = false;
    // `transparent` is compiled into the shader as an OPAQUE define. Flipping it without
    // needsUpdate reuses the cached opaque program, which discards alpha outright and
    // renders the mesh fully opaque — the model visibly refuses to hide.
    if (changed) m.needsUpdate = true;
  }
  for (const s of meshes) s.mesh.castShadow = false;  // invisible meshes still write shadows
}
function restoreModel(){
  if (!modelMatState) return;
  for (const s of modelMatState.mats){
    const changed = (s.mat.transparent !== s.transparent);
    s.mat.transparent = s.transparent;
    s.mat.opacity = s.opacity;
    s.mat.depthWrite = s.depthWrite;
    if (changed) s.mat.needsUpdate = true;
  }
  for (const s of modelMatState.meshes) s.mesh.castShadow = s.castShadow;
  modelMatState = null;
}

function scanToast(msg, kind){
  let el = document.getElementById('scanToast');

    el = document.createElement('div');

      + 'background:rgba(8,11,15,.95);border:1px solid #1f2b38;border-radius:7px;padding:9px 14px;'
      + 'font-family:var(--mono);font-size:11.5px;max-width:80vw;text-align:center';
    document.body.appendChild(el);

  el.innerHTML = msg;

}

async function setPhotoreal(on, allowDemo){
  if (photorealBusy) return;
  const btn = document.getElementById('bScan');
  // never capture or restore material state while a hover clone is live
  if (hovered){ setHighlight(hovered, false); hovered = null; }

  if (!on){
    photoreal = false;
    if (sparkRenderer) sparkRenderer.visible = false;
    if (splatMesh) splatMesh.visible = false;
    if (beaconGrp) beaconGrp.visible = false;
    restoreModel();
    btn.classList.remove('on');
    btn.textContent = '◉ Scan';
    return;
  }

  const configured = WIKI.splat && WIKI.splat.url;
  const url = configured || (allowDemo ? (WIKI.splat && WIKI.splat.demo) : null);
  if (!url){
    scanToast('No scan yet. Film the coach, train a splat, drop it next to '
      + 'index.html and set <b>WIKI.splat.url</b> — see CAPTURE.md.', 'warn');
    return;
  }

  if (!splatMesh){
    photorealBusy = true;
    btn.textContent = '◉ Loading…';
    try {
      const mod = await import('@sparkjsdev/spark');
      if (!mod || !mod.SparkRenderer || !mod.SplatMesh) throw new Error('spark: unexpected exports');
      sparkRenderer = new mod.SparkRenderer({ renderer });
      scene.add(sparkRenderer);
      splatMesh = new mod.SplatMesh({ url });
      splatMesh.visible = false;
      const fit = (WIKI.splat && WIKI.splat.fit) || { scale:1, pos:[0,0,0], rot:[0,0,0], flipY:true };
      splatMesh.scale.setScalar(fit.scale);
      splatMesh.position.set(...fit.pos);
      // Sparks's own example applies this Y-flip for photogrammetry output; splats
      // trained from phone video come out upsidedown without it.
      if (fit.flipY !== false) splatMesh.quaternion.set(1, 0, 0, 0);
      splatMesh.rotateX(THREE.MathUtils.degToRad(fit.rot[0] || 0));
      splatMesh.rotateY(THREE.MathUtils.degToRad(fit.rot[1] || 0));
      splatMesh.rotateZ(THREE.MathUtils.degToRad(fit.rot[2] || 0));
      scene.add(splatMesh);
      // Spark hooks into renderer.render() itself — there is no per-frame update() call
      // to make. Crucially this must NOT be awaited: activation cannot block on the
      // splat, or a slow/missing file leaves scan mode stuck at "Loading…" forever.
      if (splatMesh.initialized && typeof splatMesh.initialized.then === 'function'){
        const t0 = performance.now();
        splatMesh.initialized
          .then(() => { splatReady = true; splatLoadMs = Math.round(performance.now() - t0); })
          .catch(e => window.__errors.push('splat load: ' + ((e && e.message) || e)));
      } else {
        splatReady = true;   // no load signal exposed; assume the file streams in
      }
    } catch (e){
      const msg = (e && e.message) || String(e);
      window.__errors.push('photoreal: ' + msg);
      photorealBusy = false;
      btn.textContent = '◉ Scan';
      scanToast('Scan mode unavailable: ' + msg + '<br>Spark could not load (offline or blocked). '
        + 'The diagram model still works.', 'err');
      return;
    }
    photorealBusy = false;
  }

  photoreal = true;
  hideModel();
  buildBeacons().visible = true;
  splatMesh.visible = true;
  splatMesh.position.set(...((WIKI.splat && WIKI.splat.fit && WIKI.splat.fit.pos) || [0,0,0]));
  btn.classList.add('on');
  btn.textContent = '◉ Scan on';
  scanToast(configured
    ? 'Photoreal scan loaded' + (splatLoadMs != null ? ' in ' + splatLoadMs + ' ms' : '')
      + ' — click the beacons for the same spec panels.'
    : '<b>DEMO SPLAT</b> (a public sample, not the coach). This proves the pipeline end to end. '
      + 'Your own scan drops in at <b>WIKI.splat.url</b>.', configured ? 'ok' : 'warn');

  // a scan that never arrives would otherwise leave empty beacons over nothing
  if (!splatReady){
    setTimeout(() => {
      if (photoreal && !splatReady){
        scanToast('Scan file has not loaded yet (' + ((WIKI.splat && WIKI.splat.url) || 'demo')
          + '). Check the path, or that the file is served alongside index.html. '
          + 'Beacons still work for clicking.', 'warn');
      }
    }, 12000);
  }
}
document.getElementById('bScan').onclick = () => setPhotoreal(!photoreal, false);

// expose a tiny API so the wiki/scripts can drive the panel
window.Leviathan = { select, WIKI, scene, camera, controls, renderer, coach,
  setLive(d){ LIVE = Object.assign(LIVE, d); updateClock(); },
  setPhotoreal, isPhotoreal: () => photoreal,
  beacons: () => (beaconGrp ? beaconGrp.children.length : 0),
  hotspots: () => { if (!Object.keys(compBounds).length) componentBounds();
                    return Object.keys(compBounds).length; },
  // scan-mode introspection: class names are unreliable in a bundled ESM build, so the
  // panel reports its own state instead of callers sniffing constructor.name
  scanInfo: () => ({
    spark: !!sparkRenderer,
    splat: !!splatMesh,
    visible: !!(splatMesh && splatMesh.visible),
    ready: splatReady,
    loadMs: splatLoadMs,
    url: (WIKI.splat && WIKI.splat.url) || null,
    usingDemo: !(WIKI.splat && WIKI.splat.url),
    hidden: modelMatState ? modelMatState.mats.length : 0,
    fit: (WIKI.splat && WIKI.splat.fit) || null
  }) };

/* deep links — shareable URLs into a specific component or view:
     ?open=bank           open a component's panel
     ?view=basement       start in a focus view
     ?mast=0&shutters=1&night=1   set the toggles
*/
const q = new URLSearchParams(location.search);
if (q.get('view') && VIEWS[q.get('view')]){
  const v = VIEWS[q.get('view')];
  camera.position.set(...v.p); controls.target.set(...v.t);
  if (q.get('view') === 'basement') basementGrp.visible = true;
}
if (q.get('mast') === '0'){ bMast.click(); }
if (q.get('shutters') === '1'){ bShut.click(); }
if (q.get('night') === '1'){ bDay.click(); }
if (q.get('flow') === '0'){ bFlow.click(); }
if (q.get('open')) select(q.get('open'));
// ?photoreal=1 turns on scan mode, falling back to the public demo splat so the
// pipeline can be exercised before a real capture exists
if (q.get('photoreal') === '1') setPhotoreal(true, true);
</script>
</body>
</html>
